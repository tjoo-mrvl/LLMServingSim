# DeepSeek-V3 family — class catalog (Multi-head Latent Attention + DeepSeekMoE).
#
# Covers ``DeepseekV3ForCausalLM``: DeepSeek-V3 / V3-0324 / R1 / R1-0528, all
# 671B with 256 routed experts + 1 shared expert, the first
# ``first_k_dense_replace`` (3) layers running a dense MLP and the rest
# DeepseekV2MoE. vLLM serves it from ``deepseek_v2.py``, the same module as
# DeepSeek-V3.2 (``deepseek_v32.yaml``), so the class names are shared.
#
# It is a separate file rather than a ``model_types`` alias of
# ``deepseek_v32.yaml`` because V3/R1 has no sparse indexer: that catalog's
# ``pre_attn`` and component layouts expect ``Indexer`` / ``SparseAttnIndexer``
# nodes, which never fire here.
#
# Four bindings need care. The first two carry what a live profile tree
# taught the V3.2 catalog; the last two follow vLLM 0.31's MLA wrapper:
#
#  * The **shared expert is a ``DeepseekV2MLP``**, the same class as a dense
#    layer's own ``mlp``. ``not_within: DeepseekV2MoE`` keeps the shared
#    expert (2048 wide) out of the dense MLP entries (18432 wide); its cost is
#    already inside ``moe``, which binds the whole block. Without it the two
#    widths are averaged into one row that describes neither.
#  * ``q_a_layernorm`` / ``kv_a_layernorm`` share (class, parent), so the pair
#    is one canonical entry whose value is their **sum** (``mla_a_layernorm``).
#  * ``q_b_proj`` and ``kv_b_proj`` are both ``ColumnParallelLinear`` children
#    of ``DeepseekV2MLAAttention``, but vLLM 0.31 calls them in different
#    places. ``q_b_proj`` runs in ``MultiHeadLatentAttentionWrapper.forward``
#    on every step and scales with tokens, so ``mla_q_b_proj`` binds it in
#    ``dense``. ``kv_b_proj`` runs only inside ``MLAAttention``, on its
#    prefill paths (``forward_mha``, ``_compute_prefill_context``), and only
#    for requests past the backend's ``reorder_batch_threshold`` (512 new
#    tokens for FlashAttention-MLA, 128 for FlashMLA, 1 for Triton MLA);
#    shorter ones take the absorbed ``W_UK`` / ``W_UV`` decode path. Its
#    time therefore belongs to ``attention``, whose grid is keyed by batch
#    regime, and ``not_within: MLAAttention`` keeps it out of
#    ``mla_q_b_proj``. The V3.2 catalog's ``mla_b_proj`` sums both, as vLLM
#    0.28's tree did; on 0.31 that entry would also claim prefill work
#    ``attention`` already owns. Sizing follows the same split:
#    ``memory_model.calculate_sizes`` charges ``kv_b_proj``'s weight to
#    ``attention`` when no ``mla_b_proj`` carries it.
#  * ``mla_glue`` claims the wrapper's own copy kernel, which writes the
#    rotated query half back into ``q`` after ``rotary_emb``. Without it the
#    copy is CUDA work no entry measures (``profiler coverage`` reports it).
#
# Canonical layer names mirror vLLM's attribute names (see
# ../vllm/vllm/model_executor/models/deepseek_v2.py). Re-derive the bindings
# with ``python -m profiler coverage`` on the vLLM version being profiled.

blocks:
  attn:
    full_attention:
      pre_attn:  [layernorm, mla_qkv_a_proj, mla_a_layernorm, mla_q_b_proj,
                  rotary_emb, mla_glue, attention]
      post_attn: [o_proj, layernorm]
  mlp:
    dense: [gate_up_proj, act_fn, down_proj]
    moe:   [moe]
shared:
  prologue:  [embedding]
  head:      [final_layernorm, lm_head, sampler]
catalog:
  dense:
    embedding:
      vllm: VocabParallelEmbedding
      not_within: DeepSeekMultiTokenPredictor
    layernorm:
      vllm: RMSNorm
      within: DeepseekV2DecoderLayer
      tp_stable: true
    final_layernorm:
      vllm: RMSNorm
      within: [DeepseekV3ForCausalLM, DeepseekV2Model]
      tp_stable: true
    mla_qkv_a_proj:
      vllm: DeepSeekV2FusedQkvAProjLinear
    mla_a_layernorm:
      vllm: RMSNorm
      within: DeepseekV2MLAAttention
      tp_stable: true
    mla_q_b_proj:
      vllm: ColumnParallelLinear
      within: DeepseekV2MLAAttention
      not_within: MLAAttention
    o_proj:
      vllm: RowParallelLinear
      within: DeepseekV2MLAAttention
    rotary_emb:
      vllm: [DeepseekScalingRotaryEmbedding, RotaryEmbedding]
      within: MultiHeadLatentAttentionWrapper
    mla_glue:
      # The MLA wrapper's own eager work between its module calls. On vLLM
      # 0.31, ``q[..., qk_nope_head_dim:], k_pe = self.rotary_emb(...)`` in
      # ``MultiHeadLatentAttentionWrapper.forward`` writes the rotated query
      # half back into ``q`` with one copy kernel per layer, outside every
      # bound module. Exclude each child subtree: those kernels belong to the
      # children's own bindings (``attention`` owns MLAAttention's copies).
      vllm: ["void at::native::*", "Memcpy*", "Memset*"]
      within: MultiHeadLatentAttentionWrapper
      not_within: [MLAAttention, DeepSeekV2FusedQkvAProjLinear, RMSNorm,
                   ColumnParallelLinear, RowParallelLinear,
                   DeepseekScalingRotaryEmbedding, RotaryEmbedding]
    gate_up_proj:
      vllm: MergedColumnParallelLinear
      within: DeepseekV2MLP
      not_within: DeepseekV2MoE
    act_fn:
      vllm: SiluAndMul
      within: DeepseekV2MLP
      not_within: DeepseekV2MoE
    down_proj:
      vllm: RowParallelLinear
      within: DeepseekV2MLP
      not_within: DeepseekV2MoE
  per_sequence:
    lm_head:
      vllm: LogitsProcessor
    sampler:
      vllm: Sampler
      tp_stable: true
  attention:
    attention:
      vllm: MLAAttention
  moe:
    moe:
      vllm: DeepseekV2MoE
      # Audited against vLLM 0.31 deepseek_v2.py: DeepseekV2MoE reads
      # use_sequence_parallel_moe (:312), replicating the shared expert
      # (disable_tp, :266/:275), and at PP1 the decoder keeps tokens sharded
      # through attention as well -- o_proj skips its AllReduce (:1324) for a
      # ReduceScatter, and the next layer AllGathers back (:1299-1303,
      # :1371-1409). Serving refuses that attention-wide layout until it is
      # implemented.
      sequence_parallel: true
      attention_sequence_parallel: true
